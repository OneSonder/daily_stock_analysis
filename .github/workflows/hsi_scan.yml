name: HSI Signal Scan

# Daily schedule disabled. Re-enable by restoring the cron below.
# Manual runs via workflow_dispatch still work.
on:
  # schedule:
  #   # Once daily at 15:00 HKT (UTC 07:00), Mon-Fri
  #   - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      period:
        description: 'History period'
        required: false
        default: '3mo'
        type: choice
        options: ['5d', '1mo', '3mo', '6mo', '1y', '2y']
      conditions:
        description: 'Conditions to match'
        required: false
        default: 's1_breakout,s2_breakout'
        type: string
      top_n:
        description: 'Match enrich cap (0/all = all matches; default all)'
        required: false
        default: 'all'
        type: string
      etnet_top_n:
        description: 'ET Net enrich extras (0 = none; all = unlimited; default 10)'
        required: false
        default: '10'
        type: string
      holdings:
        description: 'Optional holdings override (e.g. 9988.HK 125.50). Empty = use repo variable HSI_HOLDINGS'
        required: false
        default: ''
        type: string

env:
  PYTHONUNBUFFERED: '1'
  HSI_SCAN_PERIOD: ${{ inputs.period || '3mo' }}
  HSI_SCAN_CONDITIONS: ${{ inputs.conditions || 's1_breakout,s2_breakout' }}
  HSI_ENRICH_TOP_N: ${{ inputs.top_n || 'all' }}
  HSI_ENRICH_ETNET_TOP_N: ${{ inputs.etnet_top_n || '10' }}

jobs:
  hsi-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Always run scanner code from mine (schedule still loads this YAML from the repo default branch).
          ref: mine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HSI scan + lite enrichment
        id: scan
        env:
          # LLM
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Kimi / Moonshot HSI comments (opt-in; default off — does not replace DeepSeek)
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.MOONSHOT_API_KEY }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL || secrets.KIMI_BASE_URL }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL || secrets.KIMI_MODEL }}
          KIMI_REASONING_EFFORT: ${{ vars.KIMI_REASONING_EFFORT || secrets.KIMI_REASONING_EFFORT }}
          KIMI_COMMENT_ENABLED: ${{ vars.KIMI_COMMENT_ENABLED || secrets.KIMI_COMMENT_ENABLED || 'false' }}
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL || secrets.ANSPIRE_LLM_MODEL }}
          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL || secrets.ANSPIRE_LLM_BASE_URL }}
          ANSPIRE_LLM_ENABLED: ${{ vars.ANSPIRE_LLM_ENABLED || secrets.ANSPIRE_LLM_ENABLED }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          LLM_PRIMARY_API_KEYS: ${{ secrets.LLM_PRIMARY_API_KEYS }}
          LLM_PRIMARY_BASE_URL: ${{ vars.LLM_PRIMARY_BASE_URL || secrets.LLM_PRIMARY_BASE_URL }}
          LLM_PRIMARY_MODELS: ${{ vars.LLM_PRIMARY_MODELS || secrets.LLM_PRIMARY_MODELS }}
          LLM_PRIMARY_ENABLED: ${{ vars.LLM_PRIMARY_ENABLED || secrets.LLM_PRIMARY_ENABLED }}
          # Search
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ secrets.SEARXNG_BASE_URLS }}
          # Default false: public SearXNG instances often 429; set repo var/secret to true to opt in.
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED || 'false' }}
          # HK quote sources
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # Holdings (repo variable; workflow_dispatch input overrides when non-empty)
          HSI_HOLDINGS: ${{ inputs.holdings || vars.HSI_HOLDINGS }}
        run: |
          if [ -n "$LITELLM_CONFIG_YAML" ] && [ -n "$LITELLM_CONFIG" ]; then
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            echo "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
          fi
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from src.services.hsi_enrichment import run_hsi_scan_enriched

          raw_top = (os.getenv("HSI_ENRICH_TOP_N") or "all").strip().lower()
          if raw_top in {"", "0", "all"}:
              enrich_top_n = 0
          else:
              enrich_top_n = int(raw_top)

          # ET Net extras resolved from HSI_ENRICH_ETNET_TOP_N
          # (0 = none, all = unlimited, positive = cap).
          result = run_hsi_scan_enriched(
              period=os.getenv("HSI_SCAN_PERIOD", "3mo"),
              conditions=os.getenv("HSI_SCAN_CONDITIONS", "s1_breakout,s2_breakout"),
              check_trading_day=True,
              use_multi_source=False,
              top_n=enrich_top_n,
              reports_dir=Path("reports"),
              save_report=True,
          )
          payload = result["payload"]
          enrichments = result.get("enrichments") or []
          print(json.dumps(payload.get("stats") or {}, indent=2))
          print(f"Matched: {len(payload.get('matches') or [])} stocks")
          print(f"Holdings: {len(payload.get('holdings') or [])}")
          print(
              "Enriched: "
              f"{len(enrichments)} "
              f"(top_n={result.get('top_n')!r}, etnet_top_n={result.get('etnet_top_n')!r})"
          )
          print(f"Report path: {result.get('report_path')}")
          print()
          print(result.get("report_text") or "")
          if result.get("report_path"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"report_path={result['report_path']}\n")
          PY

      - name: Upload enriched report
        if: always() && steps.scan.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: hsi-enriched-report
          path: reports/hsi_enriched_*.md
          if-no-files-found: warn
