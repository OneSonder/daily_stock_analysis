# Google Cloud Run (Knative) — template only. Replace placeholders before apply.
#
# Typical usage:
#   gcloud run services replace deploy/cloudrun-service.yaml --region REGION
# Or build from docker/Dockerfile, push to Artifact Registry, then deploy with Console/gcloud.
#
# Replace:
#   SERVICE_NAME, REGION, PROJECT_ID, IMAGE_URI
# Add secrets via Secret Manager + --set-secrets or Cloud Console.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: SERVICE_NAME
  labels:
    cloud.googleapis.com/location: REGION
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 3600
      containers:
        - image: IMAGE_URI
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: WEBUI_HOST
              value: "0.0.0.0"
            - name: PYTHONUNBUFFERED
              value: "1"
            # Point SQLite + logs + reports at writable paths (mount optional disk or use Cloud Storage separately).
            - name: DATABASE_PATH
              value: /tmp/stock_analysis.db
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 30
          # Command: API-only HTTP surface (override image CMD --schedule)
          command:
            - python
          args:
            - main.py
            - --serve-only
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
